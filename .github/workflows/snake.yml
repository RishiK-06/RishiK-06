name: GitHub Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: PaulHB-GitHub/git-hub-snake@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          svg_path: snake.svg
          github_user_name: RishiK-06

      - name: Commit snake.svg
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add snake.svg
          git commit -m "Update contribution snake" || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}